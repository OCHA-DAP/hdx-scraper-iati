methodology: Registry
caveats: |
  Information originates from various [IATI reporting organisations](http://www.d-portal.org/about.html#sources), and has not been centrally vetted or audited for accuracy or consistency.

  Includes only those activities from the [IATI Registry](https://iatiregistry.org/) that are included in [D-Portal](http://www.d-portal.org/ctrack.html#view=search).

  The total number of activities may include duplicates, if (for example) a donor and an implementing partner both report the same activity under different IATI identifiers.

  The data is automatically checked every day for any updates, and the dataset is updated when any changes are found.
