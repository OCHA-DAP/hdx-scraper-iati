base_url: "https://d-portal.org/dquery"
title: "(country) - Current IATI Aid Activities"

title_activities: IATI activities in (country) (no location information)
description_activities: Currently-active IATI activities in (country), in 3W/4W style. This dataset contains one unique activity/sector combination on each row. It is suitable for counting the total number of reported activities, or for aggregating activities by sector, reporting organisation, etc.

title_locations: IATI activity locations in (country)
description_locations: Current IATI activity locations in (country), in 3W/4W style. This dataset contains one row per location, so activities with multiple locations are repeated, and activities without location information are omitted. It is suitable for applications that want to show activity locations on a map, or find the closest geolocated activities to a settlement or camp.

